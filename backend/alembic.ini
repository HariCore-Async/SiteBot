# Database migrations. The database URL comes from the app's settings (DATABASE_URL), not from this file.
# The app applies them at startup; to run them by hand, from backend/:  alembic upgrade head
# New migration after changing app/models.py:  alembic revision --autogenerate -m "what changed"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
