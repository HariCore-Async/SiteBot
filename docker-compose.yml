# Local Postgres with pgvector. Run: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sitebot
      POSTGRES_PASSWORD: sitebot
      POSTGRES_DB: sitebot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
